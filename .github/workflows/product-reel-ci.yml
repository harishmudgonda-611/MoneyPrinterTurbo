name: Product Reel CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/product-reel-engine]

jobs:
  test-product-reel:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run focused Product Reel tests
        run: |
          python -m pytest -q tests/test_render_qa.py test/services/test_reel_task_runner.py
