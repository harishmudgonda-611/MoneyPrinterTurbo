<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Reel AI</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#171717;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:28px 18px 60px}.card{background:#fff;border:1px solid #e6e7eb;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 8px 30px #00000008}h1{margin:0 0 6px;font-size:30px}p{color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:650;font-size:14px;margin-bottom:7px}input,select,button{width:100%;border:1px solid #d8d9df;border-radius:11px;padding:12px;font:inherit}input:focus,select:focus{outline:2px solid #1112}button{background:#111;color:#fff;border:0;font-weight:700;cursor:pointer}.secondary{background:#eee;color:#111}.drop{border:1.5px dashed #bbb;padding:18px;border-radius:12px}.status{padding:12px;border-radius:10px;background:#f1f2f5;white-space:pre-wrap}.ok{background:#eaf8ef}.err{background:#fff0f0}.hidden{display:none}.preview{width:180px;aspect-ratio:9/16;object-fit:cover;border-radius:12px;background:#ddd}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:5px 9px;background:#eee;border-radius:99px;font-size:12px}.small{font-size:12px;color:#777}.result a{word-break:break-all}
</style>
</head>
<body><main class="wrap">
<div class="card"><span class="pill">PRODUCT REEL AI</span><h1>Turn a product into an original Reel</h1><p>Use a product URL, optionally upload a reference Reel, then generate a 9:16 MP4 through MoneyPrinterTurbo.</p></div>
<div class="card"><div><label>Product URL</label><input id="url" type="url" placeholder="https://example.com/product" required></div><br>
<label>Reference Reel (optional)</label><div class="drop"><input id="ref" type="file" accept="video/mp4,video/quicktime,video/webm,video/x-matroska"><div id="refInfo" class="small">No reference selected.</div></div><br>
<div class="grid"><div><label>Language</label><select id="language"><option>English</option><option>Hindi</option><option>Marathi</option><option>Hinglish</option></select></div><div><label>Platform</label><select id="platform"><option value="instagram">Instagram</option><option value="youtube_shorts">YouTube Shorts</option><option value="tiktok">TikTok</option></select></div><div><label>Duration</label><select id="duration"><option>15</option><option selected>20</option><option>30</option><option>45</option><option>60</option></select></div><div><label>Tone</label><select id="tone"><option>high-energy, trustworthy, social-first</option><option>premium, clean, aspirational</option><option>fun, fast, creator-style</option><option>problem-solution, conversion-focused</option></select></div></div><br>
<div class="row"><label style="margin:0"><input id="price" type="checkbox" checked style="width:auto"> Include verified price</label><label style="margin:0"><input id="cta" type="checkbox" checked style="width:auto"> Include CTA</label></div><br>
<button id="generate">GENERATE ORIGINAL REEL</button></div>
<div id="progress" class="card hidden"><h3>Generation</h3><div id="status" class="status">Starting…</div></div>
<div id="result" class="card hidden result"><h3>Result</h3><div class="row"><video id="video" class="preview" controls playsinline></video><div><div id="meta"></div><p><a id="download" target="_blank">Open / download MP4</a></p></div></div></div>
</main>
<script>
const $=id=>document.getElementById(id);let referenceId=null;
$('ref').onchange=()=>{$('refInfo').textContent=$('ref').files[0]?`${$('ref').files[0].name} selected`:'No reference selected.'};
async function json(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({detail:r.statusText}));if(!r.ok)throw Error(d.detail||d.message||`HTTP ${r.status}`);return d}
async function uploadReference(){const f=$('ref').files[0];if(!f)return null;$('status').textContent='Analyzing reference Reel…';const fd=new FormData();fd.append('file',f);const d=await json('/api/v1/reference-videos/analyze',{method:'POST',body:fd});return d.reference_id}
async function poll(id){for(let i=0;i<600;i++){const d=await json(`/api/v1/tasks/${encodeURIComponent(id)}`);const s=JSON.stringify(d);$('status').textContent=`Task: ${d.state||d.status||'running'}\n${d.message||''}`;if(d.state==='success'||d.status==='success'||d.state==='completed'||d.status==='completed'){const url=d.video_url||d.video||d.output_url||d.data?.video_url;if(url){showResult(url,d);return}if(d.data?.video_url){showResult(d.data.video_url,d);return}throw Error('Task completed but no video URL was returned.');}if(d.state==='failed'||d.status==='failed'||d.status==='failed_validation')throw Error(d.message||d.error||'Video generation failed.');await new Promise(r=>setTimeout(r,2000))}throw Error('Generation timed out.')}
function showResult(url,d){$('result').classList.remove('hidden');$('video').src=url;$('download').href=url;$('meta').textContent=`9:16 • 1080×1920 • ${d.qa?.passed?'QA PASS':''}`;$('status').className='status ok';$('status').textContent='Render completed and passed the workflow gate.'}
$('generate').onclick=async()=>{ $('progress').classList.remove('hidden');$('result').classList.add('hidden');$('generate').disabled=true;try{referenceId=await uploadReference();let body={product_url:$('url').value,language:$('language').value,duration_seconds:Number($('duration').value),tone:$('tone').value,platform:$('platform').value,video_source:'product_first',include_price:$('price').checked,include_cta:$('cta').checked};if(referenceId)body.reference_id=referenceId;let endpoint=referenceId?'/api/v1/reels/reference-guided/generate':'/api/v1/reels/product/generate';$('status').textContent='Generating creative and queueing renderer…';const d=await json(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});await poll(d.task_id)}catch(e){$('status').className='status err';$('status').textContent=e.message||String(e)}finally{$('generate').disabled=false}};
</script></body></html>
